    <style>
      #preloader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #050505;
        transform: translateY(0);
        transition: transform 0.62s cubic-bezier(0.76, 0, 0.24, 1);
      }
      #preloader::before {
        content: '';
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(60vw, 620px);
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        background: radial-gradient(
          circle,
          rgba(124, 92, 255, 0.13) 0%,
          rgba(124, 92, 255, 0.05) 38%,
          transparent 68%
        );
        pointer-events: none;
      }
      .preloader__inner {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.35rem;
        transition:
          opacity 0.35s ease,
          transform 0.35s ease;
      }
      .preloader__name {
        font-family: 'JetBrains Mono', ui-monospace, Consolas, monospace;
        font-size: 0.7rem;
        letter-spacing: 0.42em;
        text-transform: uppercase;
        text-indent: 0.42em;
        color: rgba(244, 244, 245, 0.62);
        animation: preloader-name 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .preloader__rail {
        display: block;
        width: clamp(120px, 24vw, 180px);
        height: 1px;
        overflow: hidden;
        background: rgba(255, 255, 255, 0.12);
      }
      .preloader__fill {
        display: block;
        width: 100%;
        height: 100%;
        transform-origin: 0 50%;
        background: linear-gradient(90deg, #7c5cff, #c9b6ff);
        animation: preloader-fill 0.62s cubic-bezier(0.5, 0, 0.2, 1) both;
      }
      @keyframes preloader-name {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes preloader-fill {
        from {
          transform: scaleX(0);
        }
        to {
          transform: scaleX(1);
        }
      }
      #preloader.is-done {
        transform: translateY(-100%);
      }
      #preloader.is-done .preloader__inner {
        opacity: 0;
        transform: translateY(-8px);
      }
      @media (prefers-reduced-motion: reduce) {
        #preloader,
        .preloader__name,
        .preloader__fill {
          animation: none;
          transition: opacity 0.2s linear;
        }
        #preloader.is-done {
          transform: none;
          opacity: 0;
          visibility: hidden;
        }
      }
    </style>
    <noscript>
      <style>
        #preloader {
          display: none;
        }
      </style>
    </noscript>

  <body>
    <div id="preloader" role="status" aria-label="Loading">
      <div class="preloader__inner">
        <span class="preloader__name">Ilia Iliadi</span>
        <span class="preloader__rail"><span class="preloader__fill"></span></span>
      </div>
    </div>
    <script>
      (function () {
        var el = document.getElementById('preloader');
        if (!el) return;
        var start = Date.now();
        var closed = false;
        function close() {
          if (closed) return;
          closed = true;
          setTimeout(
            function () {
              el.classList.add('is-done');
              setTimeout(function () {
                if (el.parentNode) el.parentNode.removeChild(el);
              }, 700);
            },
            Math.max(0, 180 - (Date.now() - start)),
          );
        }
        if (document.fonts && document.fonts.ready) {
          document.fonts.ready.then(close, close);
        } else {
          window.addEventListener('load', close);
        }
        setTimeout(close, 1200);
      })();
    </script>
    <app-root></app-root>
  </body>
