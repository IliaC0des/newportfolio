<app-cursor />
<app-nav />

<div id="smooth-wrapper" #wrapper>
  <div id="smooth-content" #content>
    <main>
      <app-hero />

      @defer (on idle; on viewport) {
        <app-about />
      } @placeholder {
        <div class="slab" aria-hidden="true"></div>
      }
      @defer (on idle; on viewport) {
        <app-projects />
      } @placeholder {
        <div class="slab slab--tall" aria-hidden="true"></div>
      }
      @defer (on idle; on viewport) {
        <app-contact />
      } @placeholder {
        <div class="slab" aria-hidden="true"></div>
      }
    </main>
  </div>
</div>
